name: Publicar Imagen en Docker Hub y Desplegar

on:
  push:
    branches: ["main", "principal"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requisitos.txt ]; then pip install -r requisitos.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Ejecutar pruebas con Pytest
        run: |
          pytest

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-and-security
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Simular construcción de contenedor
        run: echo "Construcción y empaquetado exitoso"